networks:
  traefik_public:
    external: true

  general_network:
    external: true

services:
  web:
    build: .
    container_name: ogpage
    ports:
      - "4321:4321"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - general_network
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogpage.rule=Host(`ogdevsecops.sytes.net`)"
      - "traefik.http.routers.ogpage.entrypoints=websecure"
      - "traefik.http.routers.ogpage.priority=1"
      - "traefik.http.routers.ogpage.tls=true"
      - "traefik.http.routers.ogpage.tls.certresolver=le"
      - "traefik.http.routers.ogpage.service=web"
      - "traefik.http.services.ogpage.loadbalancer.server.port=80"