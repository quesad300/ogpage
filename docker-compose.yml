services:
  ogpage:
    build: .
    image: ghcr.io/quesad300/ogpage:v1
    container_name: ogpage
    restart: unless-stopped
    networks:
      - general_network
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogpage.rule=Host(`ogdevsecops.sytes.net`)"
      - "traefik.http.routers.ogpage.entrypoints=websecure"
      - "traefik.http.routers.ogpage.priority=1"
      - "traefik.http.routers.ogpage.tls=true"
      - "traefik.http.routers.ogpage.tls.certresolver=le"
      - "traefik.http.routers.ogpage.service=ogpage"
      - "traefik.http.services.ogpage.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '1.0'    # máximo 1 CPU
          memory: 512M

networks:
  general_network:
    external: true
    attachable: true
  traefik_public:
    external: true