# OGDevSecOps - cabeceras, compresion y cache (cambio seo-optimization, WS3)
# Se sirve como drop-in: ver Include en el Dockerfile (la imagen httpd:2.4 no
# trae conf-enabled habilitado por defecto).

# mod_deflate viene compilado pero NO cargado en la imagen httpd:2.4 oficial.
<IfModule !mod_deflate.c>
  LoadModule deflate_module modules/mod_deflate.so
</IfModule>

# Pagina de error personalizada (src/pages/404.astro -> dist/404.html)
ErrorDocument 404 /404.html

# Compresion gzip (DEFLATE)
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html
  AddOutputFilterByType DEFLATE text/css
  AddOutputFilterByType DEFLATE text/plain
  AddOutputFilterByType DEFLATE text/xml
  AddOutputFilterByType DEFLATE text/javascript
  AddOutputFilterByType DEFLATE application/javascript
  AddOutputFilterByType DEFLATE application/json
  AddOutputFilterByType DEFLATE application/xml
  AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

<IfModule mod_headers.c>
  # Seguridad
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
  Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  # HTML: cache corta (el sitio es SSG; 1 h + revalidacion)
  <FilesMatch "\.(html|htm)$">
    Header set Cache-Control "public, max-age=3600, must-revalidate"
  </FilesMatch>
</IfModule>

# Assets con hash /_astro/*: cache larga inmutable
<Directory "/usr/local/apache2/htdocs/_astro">
  <IfModule mod_headers.c>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </IfModule>
</Directory>
